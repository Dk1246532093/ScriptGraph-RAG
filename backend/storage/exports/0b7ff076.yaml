      - line_number: 8
        character: 计老人
        expression: 严肃
        action: 点头，眼神望向远方
        dialogue: 不错，他是好人。他跟你一样，在一天之中死了两个最亲爱的人——他妻子和大儿子，都让那批恶人害死了。他只道汉人都是坏人。他用哈萨克话骂你，说你是‘真主降罚的强盗汉人’。你别恨他，他心里的悲痛，实在跟你一模一样。不，他年纪大了，心里感到的悲痛，可比你多得多，深得多。
