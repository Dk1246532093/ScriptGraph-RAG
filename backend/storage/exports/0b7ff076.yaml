      - line_number: 6
        character: 计老人
        expression: 叹息
        action: 叹口气，从瓦壶里倒了一碗热奶酪递给她
        dialogue: 这世界上给人欺侮的，总是那些没做坏事的人。秀儿，那个踢了你一脚的人，叫做苏鲁克。他是个正直的好人。
