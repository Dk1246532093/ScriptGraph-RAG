        dialogue: （哭着抬头）为什么……为什么恶人这么多？谁都来欺侮我？
        voice:
          emotion: 悲伤
          tone: 抽泣
      - line_number: 2
        character: 苏鲁克
        expression: 愤怒、悲恸
        action: 大步走过来，一脚踢向李文秀
        dialogue: 滚开！汉人都是强盗！真主降罚的强盗汉人！
        voice:
          emotion: 愤怒
          tone: 粗鲁
      - line_number: 3
        character: 李文秀
        expression: 惊恐
        action: 被踢倒在地，腰上肿起一块，捂着腰哭泣
        dialogue: （呜咽）我没有……我没有做坏事……
