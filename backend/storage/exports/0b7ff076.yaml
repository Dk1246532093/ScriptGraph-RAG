    export_time: '2026-06-07T21:38:46.728613'
    format_version: '1.0'
  statistics:
    scene_count: 5
    beat_count: 28
    line_count: 121
    character_count: 20
    character_appearances:
      白马李三: 9
      上官虹: 7
      李文秀: 25
      白马: 3
      霍元龙: 8
      史仲俊: 3
      众喽啰: 2
      陈达海: 8
      风沙: 1
      众盗贼: 1
      丁同: 17
      计老人: 27
      群豪甲: 1
      哈萨克妇女: 1
      群豪乙: 1
      哈萨克族长: 2
      哈萨克精壮男子: 1
      哈萨克男子甲: 1
      哈萨克男子乙: 1
      苏鲁克: 1
  scenes:
  - scene_number: 1
    scene_id: scene_1
    title: 大漠追杀
    location: 回疆大漠
    summary: 白马李三一家被吕梁三杰追杀，李三中箭、红马倒毙，三人共骑逃亡；李三断后，装死反击最终战死；上官虹用金剑银剑杀死史仲俊后殉夫；李文秀独自逃亡，追兵紧追；大风沙骤起，众人陷入求生困境。
    beats:
    - beat_number: 1
      beat_id: beat_1
      title: 红马倒毙
      theme: 逃亡
      location: 回疆大漠，沙丘连绵
      atmosphere: 紧张、悲壮
      characters:
      - 白马李三
      - 上官虹
      - 李文秀
      lines:
      - line_number: 1
        character: 白马李三
        expression: 痛苦、疲惫
        action: 伏在枣红马背上，左手紧抓缰绳，右手捂着背心箭伤
        voice:
          emotion: 隐忍
          tone: 喘息
      - line_number: 2
        character: 白马李三
        expression: 绝望
        action: 用力一提缰绳，马哀嘶倒地，他从马背上滚落，单膝跪地
        voice:
          emotion: 无奈
          tone: 低沉
      - line_number: 3
        character: 上官虹
        expression: 惊恐
        action: 回头见状，圈转白马，跳下马快步跑到李三身边
        dialogue: 大哥……怎……怎么啦？
        voice:
          emotion: 震惊
          tone: 颤抖
      - line_number: 4
        character: 李文秀
        expression: 恐惧
        action: 从母亲怀里探出头，看到父亲背上的箭，失声尖叫
        dialogue: 爹，爹，你背上有箭！
        voice:
          emotion: 惊慌
          tone: 尖锐
    - beat_number: 2
      beat_id: beat_2
      title: 三人共骑
      theme: 逃亡
      location: 大漠，红马尸体旁
      atmosphere: 紧张、坚定
      characters:
      - 白马李三
      - 上官虹
      - 李文秀
      lines:
      - line_number: 1
        character: 白马李三
        expression: 坚毅
        action: 一跃而起，轻捷地落在妻子身后马鞍上，双腿夹紧马腹
        dialogue: 不碍事！走！
        voice:
          emotion: 决绝
          tone: 快速
      - line_number: 2
        character: 上官虹
        expression: 担忧
        action: 回头深深望了丈夫一眼，扯起缰绳
        dialogue: 大哥，你……
        voice:
          emotion: 关切
          tone: 轻柔
      - line_number: 3
        character: 白马
        action: 四蹄翻飞，奋力向前疾驰，尘土飞扬
        voice:
          emotion: ''
          tone: ''
    - beat_number: 3
      beat_id: beat_3
      title: 李三断后
      theme: 牺牲
      location: 大漠，白马渐慢
      atmosphere: 绝望、悲壮
      characters:
      - 白马李三
      - 上官虹
      - 李文秀
      - 追兵（远景）
      lines:
      - line_number: 1
        character: 白马李三
        expression: 凝重
        action: 回头望向滚滚黄尘，追兵面目渐渐清晰
        dialogue: 虹妹，我求你一件事，你答不答应？
        voice:
          emotion: 坚定
          tone: 低沉
      - line_number: 2
        character: 上官虹
        expression: 温柔
        action: 回头微笑，眼中含泪
        dialogue: 这一生之中，我违拗过你一次么？
        voice:
          emotion: 深情
          tone: 柔和
      - line_number: 3
        character: 白马李三
        expression: 决绝
        action: 低头亲了亲妻子的左颊，声音变得温柔
        dialogue: 你带了秀儿逃命，保全咱两个的骨血，保全这幅高昌迷宫的地图。
        voice:
          emotion: 爱恋
          tone: 轻声
      - line_number: 4
        character: 上官虹
        expression: 惊恐、悲伤
        action: 摇头，声音发颤
        dialogue: 大哥，把地图给了他们，咱们认输便是。你……你的身子要紧。
        voice:
          emotion: 反对
          tone: 颤抖
      - line_number: 5
        character: 白马李三
        expression: 坚定
        action: 不理会妻子，拔出腰间短剑，翻身下马，用力一拍马臀
        dialogue: 走！
        voice:
          emotion: 命令
          tone: 严厉
    - beat_number: 4
      beat_id: beat_4
      title: 装死反击
      theme: 牺牲、战斗
      location: 大漠，沙丘后
      atmosphere: 激烈、悲壮
      characters:
      - 白马李三
      - 霍元龙
      - 史仲俊
      - 陈达海
      - 众喽啰
      lines:
      - line_number: 1
        character: 白马李三
        expression: 决绝
        action: 藏身沙丘后，强忍疼痛，将背心箭折断，伏地不动假装死去
        voice:
          emotion: 冷静
          tone: 低语
      - line_number: 2
        character: 霍元龙
        expression: 得意
        action: 策马走近，发现李三尸体，勒马停下
        dialogue: 哼，白马李三也不过如此！
        voice:
          emotion: 轻蔑
          tone: 大声
      - line_number: 3
        character: 史仲俊
        expression: 警惕
        action: 持枪缓缓靠近，观察
        dialogue: 小心有诈。
        voice:
          emotion: 怀疑
          tone: 低沉
      - line_number: 4
        character: 白马李三
        expression: 凶狠
        action: 突然暴起，短剑闪电般刺向霍元龙马腿，同时翻身滚开
        dialogue: 拿命来！
        voice:
          emotion: 暴怒
          tone: 大喝
      - line_number: 5
        character: 霍元龙
        expression: 惊愕
        action: 马匹受惊前蹄扬起，他挥刀格挡，但李三剑势已到，刺中他大腿
        dialogue: 啊！
        voice:
          emotion: 愤怒
          tone: 惨叫
      - line_number: 6
        character: 众喽啰
        expression: 慌乱
        action: 蜂拥而上，刀剑齐施
        dialogue: 杀了他！
        voice:
          emotion: 嘈杂
          tone: 喊杀
      - line_number: 7
        character: 白马李三
        expression: 不屈
        action: 身中数刀，仍奋力拼杀，最终力竭倒下
        dialogue: 虹妹……秀儿……
        voice:
          emotion: 悲壮
          tone: 微弱
    - beat_number: 5
      beat_id: beat_5
      title: 上官虹殉夫
      theme: 爱情、牺牲
      location: 大漠，李三尸体旁
      atmosphere: 悲壮、凄美
      characters:
      - 上官虹
      - 史仲俊
      - 李文秀（远景）
      - 陈达海
      - 追兵
      lines:
      - line_number: 1
        character: 上官虹
        expression: 悲痛欲绝
        action: 远远看到丈夫倒地，泪如雨下，翻身下马，抽出金剑银剑
        dialogue: 大哥！
        voice:
          emotion: 凄厉
          tone: 哭泣
      - line_number: 2
        character: 史仲俊
        expression: 贪婪、得意
        action: 策马靠近，看着上官虹
        dialogue: 三娘子，别来无恙？只要你跟我，保你母女平安。
        voice:
          emotion: 轻浮
          tone: 阴阳怪气
      - line_number: 3
        character: 上官虹
        expression: 厌恶、决绝
        action: 冷笑一声，双手持剑交叉，冲向史仲俊
        dialogue: 你做梦！
        voice:
          emotion: 仇恨
          tone: 冰冷
      - line_number: 4
        character: 史仲俊
        expression: 惊讶
        action: 举枪格挡，但上官虹身形轻灵，金剑银剑交错，一剑刺入他胸口
        dialogue: 你……
        voice:
          emotion: 难以置信
          tone: 呻吟
      - line_number: 5
        character: 上官虹
        expression: 解脱
        action: 拔出双剑，鲜血溅身，随即反转剑刃刺入自己心口，倒向丈夫遗体
        dialogue: 大哥，我来陪你了。
        voice:
          emotion: 平静
          tone: 轻语
      - line_number: 6
        character: 陈达海
        expression: 震惊、愤怒
        action: 下马跑过来，看到史仲俊已死，拔出青蟒剑
        dialogue: 二哥！三娘子！
        voice:
          emotion: 暴怒
          tone: 吼叫
    - beat_number: 6
      beat_id: beat_6
      title: 孤女逃亡
      theme: 逃亡
      location: 大漠，白马旁
      atmosphere: 紧张、孤独
      characters:
      - 李文秀
      - 白马
      - 陈达海
      - 众喽啰
      lines:
      - line_number: 1
        character: 李文秀
        expression: 惊恐、无助
        action: 跌跌撞撞跑向白马，爬不上马鞍，转头看追兵逼近
        dialogue: 娘！娘！
        voice:
          emotion: 哭喊
          tone: 尖锐
      - line_number: 2
        character: 白马
        action: 低鸣，用头轻推小姑娘，示意她上来
        voice:
          emotion: ''
          tone: ''
      - line_number: 3
        character: 李文秀
        expression: 咬牙
        action: 抓住马鞍，拼命翻身上马，伏在马背上，双腿乱踢
        dialogue: 走啊！快走！
        voice:
          emotion: 焦急
          tone: 叫喊
      - line_number: 4
        character: 白马
        action: 嘶鸣一声，撒蹄狂奔，卷起黄沙
        voice:
          emotion: ''
          tone: ''
      - line_number: 5
        character: 陈达海
        expression: 气急败坏
        action: 上马带领喽啰追赶，挥刀大喊
        dialogue: 追！别让那小丫头跑了！地图还在她身上！
        voice:
          emotion: 愤怒
          tone: 大喊
    - beat_number: 7
      beat_id: beat_7
      title: 大风沙
      theme: 求生
      location: 大漠，狂风沙暴
      atmosphere: 毁灭、绝望
      characters:
      - 李文秀
      - 陈达海
      - 众喽啰
      lines:
      - line_number: 1
        character: 李文秀
        expression: 害怕、坚定
        action: 回头见追兵越来越近，白马口吐白沫，突然天色昏暗，大风骤起
        dialogue: 啊！
        voice:
          emotion: 惊慌
          tone: 尖叫
      - line_number: 2
        character: 陈达海
        expression: 惊恐
        action: 勒马，黄沙扑面，视线模糊
        dialogue: 不好！是大风沙！快找地方躲避！
        voice:
          emotion: 恐惧
          tone: 大喊
      - line_number: 3
        character: 众喽啰
        expression: 慌乱
        action: 人仰马翻，四处乱跑，被风沙淹没
        dialogue: 救命！我看不见了！
        voice:
          emotion: 惨叫
          tone: 杂乱
      - line_number: 4
        character: 李文秀
        expression: 绝望
        action: 紧紧抱住马颈，风沙如刀割面，白马哀鸣着挣扎前行
        dialogue: 娘！爹！
        voice:
          emotion: 恐惧
          tone: 哭喊
      - line_number: 5
        character: 陈达海
        expression: 不甘
        action: 用布蒙住口鼻，伏在马背上，艰难前行
        dialogue: 等我躲过风沙，一定要抓住那小丫头！
        voice:
          emotion: 执着
          tone: 咬牙切齿
      - line_number: 6
        character: 风沙
        action: 铺天盖地，沙粒击打，天地混沌一片
        voice:
          emotion: ''
          tone: 呼啸
  - scene_number: 2
    scene_id: scene_2
    title: 风沙过后与发现绿洲
    location: 大漠与绿洲
    summary: 风沙之后，马贼清点损失，发现小女孩失踪。霍元龙悬赏搜索。丁同独自向西北搜索，发现绿洲，找到白马并接近草棚，与计老人相遇。
    beats:
    - beat_number: 1
      beat_id: beat_1
      title: 风暴后清点与李文秀失踪
      theme: 损失与悬疑
      location: 大漠中
      atmosphere: 疲惫、沉重、紧张
      characters:
      - 霍元龙
      - 陈达海
      - 众喽啰
      lines:
      - line_number: 1
        character: 霍元龙
        expression: 阴沉地抖落身上沙子
        action: 环视四周，清点人数
        dialogue: 都起来，看看少了多少人！
        voice:
          emotion: 焦躁
          tone: 低沉
      - line_number: 2
        character: 陈达海
        expression: 灰头土脸，数着人头
        action: 从沙中爬起，拍打衣服
        dialogue: 大哥，死了两个兄弟，五匹马。
        voice:
          emotion: 疲惫
          tone: 沙哑
      - line_number: 3
        character: 霍元龙
        expression: 眉头紧锁
        action: 扫视人群，目光锐利
        dialogue: 那白马上的小丫头呢？
        voice:
          emotion: 恼怒
          tone: 严厉
      - line_number: 4
        character: 陈达海
        expression: 面色难看
        action: 摇头，指向空旷沙漠
        dialogue: 怕是……葬在风沙里了。
        voice:
          emotion: 无奈
          tone: 低声
    - beat_number: 2
      beat_id: beat_2
      title: 霍元龙悬赏搜索
      theme: 贪欲与命令
      location: 大漠营地
      atmosphere: 喧嚣、贪婪、狂热
      characters:
      - 霍元龙
      - 众盗贼
      lines:
      - line_number: 1
        character: 霍元龙
        expression: 目光凌厉，扫视众人
        action: 举起一只手，提高声音
        dialogue: 兄弟们听着！谁发现白马和小女孩的踪迹，赏黄金五十两！
        voice:
          emotion: 决断
          tone: 高亢
      - line_number: 2
        character: 众盗贼
        expression: 群情激动，眼中放光
        action: 欢呼呼啸，纷纷上马
        dialogue: 白马！小女孩！五十两黄金！
        voice:
          emotion: 贪婪
          tone: 嘈杂
      - line_number: 3
        character: 霍元龙
        expression: 满意地点头
        action: 挥手指向四方
        dialogue: 各自散开搜索，天黑时正西六十里会合！
        voice:
          emotion: 威严
          tone: 命令
    - beat_number: 3
      beat_id: beat_3
      title: 丁同发现绿洲
      theme: 孤寂与希望
      location: 大漠沙丘
      atmosphere: 孤独、惊喜、急迫
      characters:
      - 丁同
      lines:
      - line_number: 1
        character: 丁同
        expression: 神色疲惫，但眼中闪着精光
        action: 纵马冲上沙丘，勒马远眺
        dialogue: 哈！绿洲！这么大一片！
        voice:
          emotion: 惊喜
          tone: 自言自语
      - line_number: 2
        character: 丁同
        expression: 精神一振
        action: 拍马加速，坐骑也兴奋地奔跑
        dialogue: 快！有草有水了！
        voice:
          emotion: 急切
          tone: 命令
      - line_number: 3
        character: 丁同
        expression: 警惕地观察
        action: 放慢速度，接近绿洲边缘
        dialogue: 这么多帐篷……哈萨克人？
        voice:
          emotion: 谨慎
          tone: 低声
    - beat_number: 4
      beat_id: beat_4
      title: 丁同找到白马，靠近草棚
      theme: 目标出现
      location: 绿洲边缘，草棚前
      atmosphere: 警惕、暗中观察
      characters:
      - 丁同
      lines:
      - line_number: 1
        character: 丁同
        expression: 眯起眼睛，仔细打量
        action: 远远望见孤零零的草棚，勒马慢行
        dialogue: 这屋子……倒像汉人的样式。
        voice:
          emotion: 探究
          tone: 自语
      - line_number: 2
        character: 丁同
        expression: 惊喜地睁大眼睛
        action: 看到棚边白马，压低身子
        dialogue: 白马！果然在这里！
        voice:
          emotion: 激动
          tone: 压低声音
      - line_number: 3
        character: 丁同
        expression: 面色凝重
        action: 翻身下马，手按刀柄，慢慢靠近
        dialogue: 小心驶得万年船……
        voice:
          emotion: 紧张
          tone: 轻声
    - beat_number: 5
      beat_id: beat_5
      title: 丁同与计老人相遇
      theme: 对峙与猜疑
      location: 草棚门前
      atmosphere: 警惕、试探、敌意
      characters:
      - 丁同
      - 计老人
      lines:
      - line_number: 1
        character: 计老人
        expression: 面容苍老，眼神锐利
        action: 听到动静，从草棚走出，挡在门口
        dialogue: 这位客人，从哪儿来？
        voice:
          emotion: 警惕
          tone: 迟缓而沉稳
      - line_number: 2
        character: 丁同
        expression: 堆起笑容，但目光闪烁
        action: 拱手行礼，眼神瞟向白马
        dialogue: 老人家，在下路经此地，想讨口水喝。这白马……是您的？
        voice:
          emotion: 试探
          tone: 客气
      - line_number: 3
        character: 计老人
        expression: 面色不变，微微摇头
        action: 挡在白马前面
        dialogue: 不是我的。野马，自己跑来的。
        voice:
          emotion: 冷静
          tone: 平淡
      - line_number: 4
        character: 丁同
        expression: 眼中闪过一丝不信
        action: 上前一步，手不离刀柄
        dialogue: 哦？这大漠里，野马可不多见。
        voice:
