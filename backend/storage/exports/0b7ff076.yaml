        dialogue: 是的，唱得真好听！那是天铃鸟，歌声像天上的银铃。这鸟儿只在晚上唱歌，白天睡觉。有人说，这是天上的星星掉下来之后变的。又有些哈萨克人说，这是草原上一个最美丽、最会唱歌的少女死了之后变的——她的情郎不爱她了，她伤心死的。
