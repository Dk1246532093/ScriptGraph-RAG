        action: 伏在计老人怀里，泪水如珍珠断线般流下，哭湿他的衣襟
        dialogue: （哭着）爷爷……我没了爹娘……
        voice:
          emotion: 悲伤
          tone: 抽泣
      - line_number: 4
        character: 计老人
        expression: 慈祥
        action: 轻拍李文秀的背
        dialogue: 孩子，你没了爹娘，就当我是你的亲爷爷，跟我住在一起。爷爷会好好照料你。
        voice:
          emotion: 温柔
          tone: 低沉
      - line_number: 5
        character: 李文秀
        expression: 迷茫
        action: 抬起头，揉着眼睛
        dialogue: 为什么谁都来欺侮我？我又没做坏事？
